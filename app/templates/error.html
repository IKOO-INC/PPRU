{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center pt-32 pb-20 bg-slate-50">
  <div class="container mx-auto px-6 text-center">
    <p class="text-7xl font-extrabold text-primary-600">{{ code }}</p>
    <p class="text-xl text-slate-700 mt-4 mb-8">{{ message }}</p>
    <a href="{{ url_for('public.index') }}" class="inline-flex items-center px-8 py-4 bg-accent hover:bg-accent-dark text-white rounded-full font-bold transition-colors">Kembali ke Beranda</a>
  </div>
</section>
{% endblock %}
